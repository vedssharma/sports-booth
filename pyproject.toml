[project]
name = "sports-booth"
version = "0.1.0"
description = "Live sports commentary with a multi-agent AI booth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "nba-api>=1.11.4",
    "chromadb>=1.5.8",
    "sentence-transformers>=5.4.1",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.45.0",
    "websockets>=16.0",
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = [".", "mcp_servers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["rag/chroma_db", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before the booth modules read env vars at import time
"main.py" = ["E402"]
# compact one-line setup statements in tests
"tests/*" = ["E702"]
